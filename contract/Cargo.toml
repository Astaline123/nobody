[package]
name = "nobody"
description = "An AI company with no server, no staff and no keys. A payment wakes it, and the contract is the whole business."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
nobody-core = { path = "../crates/nobody-core" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
